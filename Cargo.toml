[workspace]
members = [
    "chuangshi-common",
    "chuangshi-gmm",
    "chuangshi-rmn", 
    "chuangshi-dn",
    "chuangshi-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NDFS Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dashmap = "5.5"
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reed-solomon-erasure = "6.0"
sha2 = "0.10"
bytes = "1.5"
futures = "0.3"
raft = "0.7"
config = "0.13"